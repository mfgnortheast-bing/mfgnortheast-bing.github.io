<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 | Personal Site</title>
<meta name="description" content="个人主页 — 成长经历、学习工作履历、个人成就和项目、理想">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#d9b26a;--paper:#f5f1e8;--overlap:5%}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0a0c10;color:var(--paper);height:100vh;overflow:hidden;
    display:flex;flex-direction:column}
  header{position:relative;z-index:5;text-align:center;padding:1.8rem 1rem .9rem;flex:0 0 auto}
  header h1{font-size:clamp(1.4rem,3vw,2.3rem);letter-spacing:.24em;font-weight:600}
  header .sub{margin-top:.55rem;font-size:.78rem;letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
  header .rule{width:64px;height:2px;background:var(--gold);margin:.9rem auto 0;opacity:.8}

  /* ===== 宽屏：一排四块，相邻块边缘轻微交叠渗透，无深色分割线 ===== */
  main{flex:1 1 auto;display:flex;flex-direction:row;align-items:stretch;justify-content:center;
    padding:0 clamp(.3rem,1.6vw,1.6rem) 1.2rem;width:100%;max-width:1600px;margin:0 auto;min-height:0}
  .panel{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;text-align:center;
    text-decoration:none;color:var(--paper);isolation:isolate;
    padding:1.4rem .9rem 2rem;
    background-size:cover;background-position:center;
    filter:saturate(.72) brightness(.72);
    transition:flex-grow .55s cubic-bezier(.22,.61,.36,1),filter .5s ease}
  /* 相邻块左右各向外多铺一点（负外边距让图互相压住），中间不留缝 */
  .panel + .panel{margin-left:calc(-1 * var(--overlap))}
  /* 上下暗罩，保证文字可读（只压上下，不压左右） */
  .panel::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,12,16,.32) 0%,rgba(10,12,16,.7) 60%,rgba(10,12,16,.94) 100%);
    transition:opacity .5s ease}
  /* 左右只做极轻微的柔边渗透，不出现深色粗线 */
  .panel::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(90deg,
      rgba(10,12,16,.28) 0%,
      rgba(10,12,16,0) calc(var(--overlap) * 1.6),
      rgba(10,12,16,0) calc(100% - var(--overlap) * 1.6),
      rgba(10,12,16,.28) 100%);
    transition:opacity .5s ease}
  .panel:first-child::after{background:linear-gradient(90deg,
      rgba(10,12,16,0) 0%,
      rgba(10,12,16,0) calc(100% - var(--overlap) * 1.6),
      rgba(10,12,16,.28) 100%)}
  .panel:last-child::after{background:linear-gradient(90deg,
      rgba(10,12,16,.28) 0%,
      rgba(10,12,16,0) calc(var(--overlap) * 1.6),
      rgba(10,12,16,0) 100%)}
  .panel:hover,.panel:focus-visible{flex-grow:1.7;filter:saturate(1.02) brightness(.92);outline:none;z-index:3}
  .panel:hover::before,.panel:focus-visible::before{opacity:.68}
  .panel:hover::after,.panel:focus-visible::after{opacity:.4}
  .panel .idx{position:absolute;top:1rem;left:1.1rem;z-index:2;font-size:.72rem;letter-spacing:.3em;color:var(--gold);opacity:.85}
  .panel .title{position:relative;z-index:2;font-size:clamp(.95rem,1.55vw,1.5rem);font-weight:600;
    letter-spacing:.1em;line-height:1.4}
  .panel .en{position:relative;z-index:2;margin-top:.5rem;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.9}
  .panel .more{position:relative;z-index:2;margin-top:.7rem;font-size:.72rem;letter-spacing:.16em;
    opacity:0;transform:translateY(6px);transition:opacity .45s ease .08s,transform .45s ease .08s}
  .panel:hover .more,.panel:focus-visible .more{opacity:.85;transform:translateY(0)}

  footer{flex:0 0 auto;position:relative;z-index:5;text-align:center;padding:.7rem 1rem 1rem;
    font-size:.72rem;letter-spacing:.14em;color:rgba(245,241,232,.45)}
  footer a{color:var(--gold);text-decoration:none}
  .lang{position:absolute;top:.9rem;right:1.1rem;z-index:10;font-size:.68rem;letter-spacing:.14em}
  .lang a{color:rgba(245,241,232,.5);text-decoration:none;margin-left:.55rem}
  .lang a.on{color:var(--gold)}

  /* ===== 窄屏（手机竖屏）：改回纵向上下排布 ===== */
  @media (max-width:760px), (max-aspect-ratio:1/1) and (max-width:900px){
    body{height:auto;min-height:100vh;overflow-y:auto;overflow-x:hidden}
    header{padding-top:2.8rem}
    main{flex-direction:column;align-items:stretch;padding:.4rem 1rem 1.6rem;gap:.5rem;max-width:none}
    .panel{flex:0 0 auto;min-height:200px;border-radius:12px;padding:1.2rem 1.2rem 1.6rem;justify-content:flex-end}
    .panel + .panel{margin-left:0}
    /* 竖排时改为上下柔边渗透 */
    .panel::after,
    .panel:first-child::after,
    .panel:last-child::after{background:linear-gradient(180deg,
      rgba(10,12,16,.6) 0%,
      rgba(10,12,16,0) 12%,
      rgba(10,12,16,0) 88%,
      rgba(10,12,16,.6) 100%)}
    .panel:hover,.panel:focus-visible{flex-grow:0}
    .panel .title{font-size:1.15rem}
    .panel .more{opacity:.7;transform:none}
    .panel .en{display:inline-block}
  }
</style>
</head>
<body>
  <div class="lang"><a class="on" href="./">中文</a><a href="./en/">EN</a></div>
  <header>
    <h1>个 人 主 页</h1>
    <div class="sub">Personal Site</div>
    <div class="rule"></div>
  </header>
  <main>

      <span class="idx">01</span><span class="title">成长经历</span><span class="en">Growth</span><span class="more">走进来 →</span>
    </a>
    <a class="panel" href="career.html" style="background-image:url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1200&q=70')">
      <span class="idx">02</span><span class="title">学习工作履历</span><span class="en">Education &amp; Career</span><span class="more">走进来 →</span>
    </a>
    <a class="panel" href="achievements.html" style="background-image:url('https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1200&q=70')">
      <span class="idx">03</span><span class="title">个人成就和项目</span><span class="en">Achievements &amp; Projects</span><span class="more">走进来 →</span>
    </a>
    <a class="panel" href="dreams.html" style="background-image:url('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=70')">

  </main>
  <footer>© <span id="y"></span> · <a href="https://github.com/mfgnortheast-bing">mfgnortheast-bing</a>

  </footer>
</body>
</html>
